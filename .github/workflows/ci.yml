name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn ts-check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn test

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn knip

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: npx playwright install --with-deps chromium

      - run: yarn test:e2e

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: npx playwright install --with-deps chromium

      - run: yarn test:e2e e2e/a11y.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: test-results/
